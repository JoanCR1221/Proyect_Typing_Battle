# CI del Equipo 4 (Typing Battle).
# Implementa 05-cicd-testing-commits.md de battlehub-contracts: en cada PR hacia main
# (y en cada push a main) se ejecutan restore/install, build, lint, pruebas unitarias y
# pruebas de integración del backend (.NET 10) y del frontend (Aurelia).
#
# No agregar filtros "paths:" a los triggers: si un check obligatorio no se ejecuta,
# el PR queda esperándolo indefinidamente.

name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    name: Backend (.NET 10)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore

      - name: Unit tests
        run: dotnet test --no-build --filter "Category=Unit"

      - name: Integration tests
        run: dotnet test --no-build --filter "Category=Integration"

  frontend:
    name: Frontend (Aurelia)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/frontend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install
        run: npm ci

      - name: Lint (tipos de TypeScript)
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Unit tests
        run: npm test
